name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install
        run: pip install -e ".[dev,diff]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Page script syntax
        run: |
          node --check src/tirai/assets/annotate.js
          node --check src/tirai/assets/targets.js
          node --check src/tirai/assets/capture.js
          node --check src/tirai/assets/resolve-target.js
      - name: Tests
        run: pytest -q

  e2e:
    name: End-to-end (agent-browser headless, GitHub Action)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Serve the smoke page
        run: |
          nohup python3 -m http.server 8765 --bind 127.0.0.1 --directory examples/ci/site >/dev/null 2>&1 &
          sleep 1
      - name: Record with the TIRAI action
        uses: ./
        with:
          scenarios: examples/ci/smoke.yaml
          out: evidence/ci
          artifact-name: tirai-e2e-evidence
      - name: Check the evidence
        run: |
          test -s evidence/ci/smoke/record/final.mp4
          grep -q 'tests="2"' evidence/ci/junit.xml
          grep -q 'failures="0"' evidence/ci/junit.xml

  install:
    name: Installer on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install.sh (macOS/Linux)
        if: runner.os != 'Windows'
        env:
          TIRAI_SOURCE: ${{ github.workspace }}
          TIRAI_INSTALL_MODE: source
        run: |
          sh install.sh --yes --skip ffmpeg,browserskill --agent claude --agent codex --agent antigravity
          ~/.local/bin/tirai --version
          ~/.local/bin/tirai setup --dry-run --agent cursor
          test -f ~/.claude/skills/tirai-evidence/SKILL.md
          test -f ~/.agents/skills/tirai-evidence/SKILL.md
          test -f ~/.gemini/antigravity/skills/tirai-evidence/SKILL.md
      - name: install.ps1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TIRAI_SOURCE: ${{ github.workspace }}
          TIRAI_INSTALL_MODE: source
        run: |
          ./install.ps1 --yes --skip ffmpeg,browserskill --agent claude --agent codex --agent antigravity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$HOME\.local\bin\tirai.cmd" --version
          & "$HOME\.local\bin\tirai.cmd" setup --dry-run --agent cursor
          foreach ($p in @('.claude\skills', '.agents\skills', '.gemini\antigravity\skills')) {
            if (-not (Test-Path (Join-Path $HOME "$p\tirai-evidence\SKILL.md"))) { throw "missing skill in $p" }
          }
