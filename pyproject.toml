[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tirai"
version = "2.1.0"
description = "Scenario-driven test evidence recorder: BrowserSkill + DBX web + on-screen annotations + ffmpeg composition, packaged as an agent skill."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["PyYAML>=5.4"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["PyMySQL>=1.1"]
excel = ["openpyxl>=3.1", "Pillow>=9"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
tirai = "tirai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tirai"]

[tool.hatch.build.targets.wheel.force-include]
"skills/tirai-evidence" = "tirai/skill/tirai-evidence"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
